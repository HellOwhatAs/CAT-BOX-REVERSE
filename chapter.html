<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>阅读漫画</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <script src="data.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js');
            });
        }
    </script>
</head>
<body>

    <div class="reader-container">
        
        <div class="reader-nav top" style="justify-content: center;">
            <span id="chapter-title-display" style="font-weight: bold;"></span>
        </div>

        <div id="comic-pages">
            <!-- Images injected here -->
        </div>

        <div class="reader-nav bottom">
             <div class="nav-center">
                <a href="index.html" class="nav-btn">目录</a>
            </div>
            <div>
                <a id="prev-btn-bottom" href="#" class="nav-btn">上一话</a>
                <a id="next-btn-bottom" href="#" class="nav-btn" style="margin-left: 10px;">下一话</a>
            </div>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof comicData === 'undefined') {
                alert("Could not load data.js");
                return;
            }

            const urlParams = new URLSearchParams(window.location.search);
            const chapterId = parseInt(urlParams.get('id'));

            if (!chapterId) {
                alert("未指定章节");
                window.location.href = 'index.html';
                return;
            }

            const chapter = comicData.chapters.find(c => c.index === chapterId);

            if (!chapter) {
                document.getElementById('comic-pages').innerHTML = "<p style='padding:20px; text-align:center;'>章节未找到或未下载。</p>";
                updateNav(null, null);
                return;
            }

            document.title = `${chapter.title} - ${comicData.title}`;
            document.getElementById('chapter-title-display').textContent = `第 ${chapter.index} 话: ${chapter.title}`;

            // Render Images or Show error if empty
            const container = document.getElementById('comic-pages');
            
            if (!chapter.images || chapter.images.length === 0) {
                container.innerHTML = "<p style='padding:50px; text-align:center;'>本章节暂无图片。</p>";
            } else {
                // Use invalid characters replacement if needed, but modern browsers handle paths well.
                // We use encodeURIComponent for path parts to be safe.
                
                chapter.images.forEach(imgName => {
                    const img = document.createElement('img');
                    // We need to handle the path carefully. 
                    // folderName + / + imgName. 
                    // encodeURIComponent encodes / as well which breaks path, so encode parts.
                    const src = encodeURIComponent(chapter.folderName) + '/' + encodeURIComponent(imgName);
                    
                    img.src = src;
                    img.className = 'comic-page';
                    img.loading = 'lazy'; // Native lazy loading
                    img.alt = imgName;
                    container.appendChild(img);
                });
            }

            // Navigation Logic
            // Find current index in the array to get next/prev
             const currentIndex = comicData.chapters.findIndex(c => c.index === chapterId);
             
             let prevChapter = null;
             let nextChapter = null;

             if (currentIndex > 0) {
                prevChapter = comicData.chapters[currentIndex - 1];
             }
             
             if (currentIndex < comicData.chapters.length - 1) {
                nextChapter = comicData.chapters[currentIndex + 1];
             }

             updateNav(prevChapter, nextChapter);


            // Placeholder Logic
            // We need placeholders to prevent layout jump when switching to fixed mode
            // or just to keep the original space occupied if we want "clone" behavior.
            // But with the "Move" logic:
            // 1. Initially Static. Limit: Navs are part of flow.
            // 2. Switch to Fixed: Nav leaves flow. Original space collapses.
            //    -> We must show a placeholder of same height.
            // 3. Switch to Static: Nav back to flow.
            //    -> Hide placeholder.
            
            const navs = document.querySelectorAll('.reader-nav');
            const placeholders = [];

            navs.forEach(nav => {
                const p = document.createElement('div');
                p.className = 'nav-placeholder';
                // Set height? We will set it dynamically on switch or just rely on content
                // Better to set explicit height when active
                p.style.display = 'none'; 
                nav.parentNode.insertBefore(p, nav); // Insert before (or after, doesn't matter for top/bottom logic much if flow matches)
                // For top nav: placeholder should be where nav was.
                // For bottom nav: same.
                // Since we use insertBefore, p is above nav.
                // For Top Nav: P then Nav. If Nav fixed -> P stays, Nav jumps out. Correct.
                // For Bottom Nav: P then Nav. If Nav fixed -> P stays. Correct.
                placeholders.push({ nav, placeholder: p });
            });


            // Toggle Logic
            function toggleNav(showFixed) {
                placeholders.forEach(({ nav, placeholder }) => {
                    if (showFixed) {
                        // Capture height and position before switching if needed
                        if (!nav.classList.contains('fixed-mode')) {
                             const rect = nav.getBoundingClientRect();
                             placeholder.style.height = rect.height + 'px';
                             placeholder.style.display = 'block';
                             
                             nav.classList.add('fixed-mode');

                             // Intelligent Animation Logic:
                             // Calculate exact visual delta to animate from "current scroll position" to "fixed position".
                             const height = rect.height;
                             let startY = 0;

                             if (nav.classList.contains('top')) {
                                 // Top Nav: Target is 0. Current is rect.top.
                                 // If scrolled down, rect.top is negative.
                                 // Limit startY to -height (full slide-in) to avoid flying from infinity.
                                 startY = Math.max(rect.top, -height);
                             } else {
                                 // Bottom Nav: Target is (windowHeight - height). Current is rect.top.
                                 const targetTop = window.innerHeight - height;
                                 const diff = rect.top - targetTop;
                                 // Limit startY to height (full slide-up)
                                 startY = Math.min(diff, height);
                             }
                             
                             // Only animate if there is a noticeable jump (> 1px)
                             if (Math.abs(startY) > 1) {
                                 nav.style.setProperty('--translate-start', `${startY}px`);
                                 nav.classList.add('animate-dynamic');
                             }
                        }
                    } else {
                        // Revert to static
                         if (nav.classList.contains('fixed-mode')) {
                             nav.classList.remove('fixed-mode');
                             nav.classList.remove('animate-dynamic'); 
                             nav.style.removeProperty('--translate-start');
                             placeholder.style.display = 'none';
                         }
                    }
                });
            }

            // Click to toggle
            document.addEventListener('click', (e) => {
                // Ignore clicks on buttons, links, or the nav bar itself
                if (e.target.closest('a') || e.target.closest('button') || e.target.closest('.reader-nav')) return;
                
                // Check current state
                const isFixed = navs[0].classList.contains('fixed-mode');
                toggleNav(!isFixed); 
            });

            // Scroll Logic (Revert to Static on scroll)
            window.addEventListener('scroll', () => {
                // If we are scrolling, and UI is fixed (floating), revert it to static (hide it from view, put back to flow)
                // Exception: if we are at bottom, static UI is visible naturally.
                // Exception: if we are at top, static UI is visible naturally.
                
                // We just want to ensure "floating" mode is dismissed on scroll.
                // But we don't want to dismiss it INSTANTLY if the user just tapped. 
                // However, standard interaction is: scroll = reading = hide controls.
                
                // Small buffer to prevent accidental triggers (e.g. touch jitter)
                // But here, switching to static means it jumps out of view if not at ends.
                
                 if (navs[0].classList.contains('fixed-mode')) {
                     toggleNav(false);
                 }
            }, {passive: true});
        });

        function updateNav(prev, next) {
            const setBtn = (id, chap) => {
                const el = document.getElementById(id);
                if (chap) {
                    el.href = `chapter.html?id=${chap.index}`;
                    el.classList.remove('disabled');
                } else {
                    el.href = '#';
                    el.classList.add('disabled');
                }
            };

            setBtn('prev-btn-bottom', prev);
            setBtn('next-btn-bottom', next);
        }
    </script>
</body>
</html>
